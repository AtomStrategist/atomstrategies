<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Atom Strategies</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>

    body {
      margin: 0;
      background-color: white;
    }

    nav {
      height: 200px;
      padding: 0 2rem;

      display: flex;
      justify-content: flex-end;
      align-items: center;

      position: sticky;
      top: 0;

      background-color: rgb(48, 110, 86);
      border-bottom: 4px solid rgb(42, 32, 22);

      z-index: 100;
    }

    /* LOGO — LEFT SIDE */
    .logo-image {
      position: absolute;
      left: 2rem;
      top: 50%;

      transform: translateY(-50%);
    }

    .logo-image img {
      height: 100px;
      width: auto;
      display: block;
    }

    /* ATOM STRATEGIES — DEAD CENTER */
    .logo-title {
      position: absolute;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      margin: 0;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 3.5rem;
      font-weight: 400;
      font-style: italic;

      color: white;
    }

    /* NAVIGATION */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;

      list-style: none;

      margin: 0;
      padding: 0;
    }

    .nav-links a {
      font-family: Georgia, "Times New Roman", serif;
      color: white;

      text-decoration: none;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

  </style>

</head>

<body>

  <nav>

    <!-- LOGO ON LEFT -->
    <a href="index.html" class="logo-image">
      <img src="atomlogo.png" alt="Atom Strategies logo">
    </a>

    <!-- TITLE IN CENTER -->
    <h1 class="logo-title">
      Atom Strategies
    </h1>

    <!-- NAVIGATION ON RIGHT -->
    <ul class="nav-links">

      <li>
        <a href="tabs/abouttab.html">About</a>
      </li>

      <li>
        <a href="tabs/worktab.html">Work</a>
      </li>

      <li>
        <a href="tabs/servicestab.html">Services</a>
      </li>

      <li>
        <a href="tabs/contacttab.html">Contact</a>
      </li>

    </ul>

  </nav>

</body>

</html>
